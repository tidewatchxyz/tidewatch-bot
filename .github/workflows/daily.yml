name: Daily charts

on:
  schedule:
    - cron: "15 5 * * *" # 05:15 UTC = 08:15 in Addis Ababa
  workflow_dispatch:
    inputs:
      market:
        description: "Polymarket market slug for the odds chart (blank = most traded)"
        required: false

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render charts
        run: |
          if [ -n "${{ inputs.market }}" ]; then
            python -m tidewatch daily --market "${{ inputs.market }}"
          else
            python -m tidewatch daily
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidewatch-${{ github.run_id }}
          path: out/
          retention-days: 14
